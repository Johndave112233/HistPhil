steps:
  - name: Checkout project
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'

  - name: Setup Gradle Environment
    uses: gradle/actions/setup-gradle@v3

  - name: Set up Android SDK
    uses: subosito/android-sdk-action@v2
    with:
      api-level: 33
      build-tools: '33.0.2'
      components: 'platform-tools,platforms;android-33,build-tools;33.0.2,cmdline-tools;latest'

  - name: Accept Android SDK Licenses
    run: |
      yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

  - name: Create debug keystore
    run: |
      keytool -genkeypair \
        -v \
        -keystore debug.keystore \
        -storepass android \
        -alias androiddebugkey \
        -keypass android \
        -keyalg RSA \
        -keysize 2048 \
        -validity 10000 \
        -dname "CN=Android Debug,O=Android,C=US"

  - name: Build Debug APK with System Gradle
    run: |
      chmod +x ./gradlew
      ./gradlew assembleDebug --stacktrace --no-daemon

  - name: Upload Compiled APK
    uses: actions/upload-artifact@v4
    with:
      name: HisPhi-Debug-APK
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
