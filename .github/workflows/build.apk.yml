name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 17 is standard for modern AGP)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Step 3: Grant execution permission for the Gradle Wrapper
      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      # Step 4: Ensure dynamic environment config exists (Handles missing .env)
      - name: Setup Environment Variables
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

      # Step 5: Build Debug APK using Gradle
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 6: Locate and Upload the generated APK as a workflow artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HistPhil-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
